# Triggered by pushing a v<version> tag: test → package DMG → attest provenance → publish
# a GitHub Release. The DMG version comes from the tag (v0.3.2 → HidiPi-0.3.2.dmg), passed
# to the packaging script via HIDIPI_VERSION.
# Downloaders can verify provenance: gh attestation verify HidiPi-<version>.dmg -R <this repo>
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # gh release: create the Release and upload assets
  id-token: write   # attest-build-provenance's Sigstore keyless signing

jobs:
  dmg:
    # macos-latest = macOS 26 arm64; the virtual display code is arch(arm64)-gated
    # (Apple Silicon only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Validate tag format
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "Tag must look like v0.3.2: $GITHUB_REF_NAME"; exit 1; }

      - name: Unit tests
        run: swift test

      - name: Package DMG
        run: HIDIPI_VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      # SLSA build provenance: records by content digest that "this DMG came from this
      # repository's build", verifiable offline
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: dist/*.dmg

      - name: Publish Release and upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          # If the Release already exists (re-run), overwrite the assets instead
          gh release create "$TAG" dist/*.dmg \
            --title "HidiPi ${TAG#v}" \
            --generate-notes \
          || gh release upload "$TAG" dist/*.dmg --clobber
